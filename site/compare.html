<!DOCTYPE html>
<html>
  <head>
  <link rel="stylesheet" type="text/css" href="/_stylesheets/default.css">
  </head>
  <body>
    <form id='pagebar' action='/'>
      Page <input id='page-number' type='text' value=0 /> of <span id='pages'>0</span>:
      <input id='path' type='text' value='/chromium-projects' />
      <button id='prev'>Prev</button>
      <button id='next'>Next</button>
      (See <a href="https://goto.google.com/chromium-site-review">go/chromium-site-review</a>
       for the full list.)
    </form>
    <div id='pages-container'>
      <div>
        <h3><a id='old-link' href="/originals/chromium-projects">Old</a></h3>
        <iframe id='old-frame' src='/originals/chromium-projects'></iframe>
      </div>
      <div>
        <h3><a id='new-link' href="/chromium-projects">New</a></h3>
        <iframe id='new-frame' src='/chromium-projects'></iframe>
      </div>
    </div>
    <script>
      fetch('/pages.json').
        then(resp => resp.blob()).
        then(blob => blob.text()).
        then(
          function (text) {
            let pages = JSON.parse(text);
            let current_page = 1;
            let container = document.getElementById('pages-container');
            let page_number = document.getElementById('page-number');
            let path = document.getElementById('path');
            let currentHeight = 0;

            function rtrim(x, characters) {
              var start = 0;
              var end = x.length - 1;
              while (characters.indexOf(x[end]) >= 0) {
                end -= 1;
              }
              return x.substr(0, end + 1);
            }

            document.getElementById('page-number').onchange = function(evt) {
              updateLocation(page_number.value);
              evt.preventDefault();
              return false;
            }
            document.getElementById('pages').innerText = pages.length;
            document.getElementById('prev').onclick = function(el) {
              current_page -= 1;
              updateLocation(current_page);
              el.preventDefault();
              return false;
            };
            document.getElementById('next').onclick = function(el) {
              current_page += 1;
              updateLocation(current_page);
              el.preventDefault();
              return false;
            };
            document.getElementById('pagebar').onsubmit = function(evt) {
              evt.preventDefault();
              return false;
            };

            function updateLocation(page) {
              if (!page) {
                return;
              }
              current_page = parseInt(page);
              if (isNaN(current_page)) {
                let idx = pages.indexOf(page);
                if (idx != -1) {
                  current_page = idx + 1;
                } else {
                  current_page = 1;
                }
              } else if (current_page > pages.length) {
                current_page = 1;
              } else if (current_page < 1) {
                current_page = pages.length;
              }

              page_number.value = current_page;
              path.value = rtrim(pages[current_page - 1], '/');
              window.history.pushState({}, '', 'compare.html?page=' + path.value);

              let [old_a, new_a] = document.querySelectorAll('#pages-container a');
              updateHrefIfChanged(old_a, '/originals' + path.value);
              updateHrefIfChanged(new_a, path.value);

              let [old_frame, new_frame] = document.querySelectorAll('#pages-container iframe');
              updateSrcIfChanged(old_frame, '/originals' + path.value);
              updateSrcIfChanged(new_frame, path.value);
              
            }

            function adjustHeight() {
              let [old_frame, new_frame] = document.querySelectorAll(
                    '#pages-container iframe');
              let old_ht = old_frame?.contentWindow?.document?.body?.offsetHeight,
                  new_ht = new_frame?.contentWindow?.document?.body?.offsetHeight;
              let ht;
              if (old_ht && new_ht) {
                ht = (old_ht > new_ht) ? old_ht : new_ht;
                old_frame.style.height = ht + 'px';
                new_frame.style.height = ht + 'px';
              }
            }

            function periodicTasks() {
              adjustHeight();
              setTimeout(periodicTasks, 100);
            }

            function updateSrcIfChanged(iframe, val) {
              let u = new URL(iframe.src);
              if (u.pathname != val) {
                iframe.src = val;
              }
            }
            function updateHrefIfChanged(a, val) {
              let u = new URL(a.href);
              if (u.pathname != val) {
                a.href = val;
              }
            }

            let page = new URL(document.location).searchParams.get("page");
            updateLocation(page);
            setTimeout(periodicTasks, 100);
          });
    </script>
  </body>
</html>
